name: SauceDemo UI Tests

on:
  push:
    branches: [main, master]
  pull_request:
  # "Run workflow" button in the Actions tab; optionally pick a TestNG group
  workflow_dispatch:
    inputs:
      groups:
        description: "TestNG group(s) to run, comma separated (empty = all). e.g. smoke,checkout"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Chrome is preinstalled on ubuntu-latest; Selenium Manager fetches the matching chromedriver.
      # Tests run headless automatically because GitHub sets the CI environment variable.
      - name: Run tests
        env:
          TEST_GROUPS: ${{ github.event.inputs.groups }}
        run: |
          GROUPS_ARG=""
          if [ -n "$TEST_GROUPS" ]; then GROUPS_ARG="-Dgroups=$TEST_GROUPS"; fi
          chmod +x mvnw
          ./mvnw -B clean test $GROUPS_ARG 2>&1 | tee console.log
          exit ${PIPESTATUS[0]}

      - name: Publish summary
        if: always()
        run: |
          echo "## SauceDemo test results" >> "$GITHUB_STEP_SUMMARY"
          grep -E "Tests run:.*Fail" console.log | tail -1 >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the **test-report** artifact below for the full HTML report, logs and screenshots." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            target/surefire-reports/
            target/logs/
            target/screenshots/
            console.log
          if-no-files-found: warn
          retention-days: 14
